<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>INT191: Relational DB Concepts & Design - Study Hub & 70 Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-muted: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: #dbeafe;
            --border: #e2e8f0;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --warning: #d97706;
            --warning-bg: #fef3c7;
            --code-bg: #1e293b;
            --code-text: #f8fafc;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        :root[data-theme="dark"] {
            --bg-main: #0b1120;
            --bg-card: #1e293b;
            --bg-muted: #334155;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --accent-soft: rgba(56, 189, 248, 0.15);
            --border: #334155;
            --success: #4ade80;
            --success-bg: rgba(74, 222, 128, 0.15);
            --danger: #f87171;
            --danger-bg: rgba(248, 113, 113, 0.15);
            --warning: #fbbf24;
            --warning-bg: rgba(251, 191, 36, 0.14);
            --code-bg: #090d16;
            --code-text: #e2e8f0;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.65;
            font-size: 16px;
            transition: background-color 0.25s, color 0.25s;
        }

        /* Responsive Header */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 0.7rem 1rem;
        }

        .nav-bar {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.65rem;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--bg-muted);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            min-height: 40px;
        }

        .btn.active, .btn:hover {
            background-color: var(--accent);
            color: #0b1120;
            border-color: var(--accent);
        }

        :root[data-theme="light"] .btn.active,
        :root[data-theme="light"] .btn:hover {
            color: #ffffff;
        }

        .container {
            max-width: 1280px;
            margin: 1.25rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .tab-pane { display: none; width: 100%; }
        .tab-pane.active { display: block; }

        /* Study Layout Grid (Desktop vs iPad/Mobile) */
        .study-layout {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            gap: 1.5rem;
            align-items: start;
        }

        main {
            min-width: 0; /* ป้องกัน Grid ทะลุขอบจอบน iPad/Mobile */
            width: 100%;
        }

        .toc-box {
            position: sticky;
            top: 76px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: var(--shadow);
        }

        .toc-toggle-btn {
            display: none;
            width: 100%;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.65rem 1rem;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            justify-content: space-between;
            align-items: center;
        }

            font-size
